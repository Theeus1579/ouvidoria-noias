<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ouvidoria Oficial - Só Noia de Corote</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 500px;
            border: 2px solid #ff4444;
        }
        h1 {
            color: #ff4444;
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 10px;
        }
        p.subtitle {
            text-align: center;
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            background-color: #2b2b2b;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
        }
        textarea {
            resize: vertical;
            height: 100px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #ff4444;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #cc0000;
        }
        .footer {
            text-align: center;
            margin-top: 15px;
            font-size: 0.8rem;
            color: #666;
            border-top: 1px solid #333;
            padding-top: 10px;
        }
        .version {
            font-size: 0.75rem;
            color: #555;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🚨 OUVIDORIA DOS NOIAS 🚨</h1>
        <p class="subtitle">Escolha o servidor culpado, desabafe e deixe a planilha zoar você.</p>
        
        <form id="reclamacaoForm">
            <label for="nome">Seu Nick de Chorão:</label>
            <input type="text" id="nome" required placeholder="Ex: MaHaunter">

            <label for="jogo">Qual servidor estragou seu dia?</label>
            <select id="jogo" required>
                <option value="" disabled selected>Carregando servidores da planilha...</option>
            </select>

            <label for="choroUsuario">Sua Reclamação Dramática:</label>
            <textarea id="choroUsuario" required placeholder="Escreva sua indignação aqui..."></textarea>

            <button type="submit">Enviar Reclamação para o Lixo 🗑️</button>
        </form>
        
        <div class="footer">
            "Ninguém aqui é obrigado" - Regra 6 📜
            <div class="version">Versão v1.3</div>
        </div>
    </div>

    <script>
        const urlSheetDB = 'https://sheetdb.io/api/v1/9d77rwu58o76z';

        // Puxa os servidores unicos da planilha para preencher o select
        async function carregarServidores() {
            try {
                const resposta = await fetch(urlSheetDB);
                const dados = await resposta.json();
                
                const selectJogo = document.getElementById('jogo');
                selectJogo.innerHTML = '<option value="" disabled selected>Selecione o servidor...</option>';

                // Filtra os servidores únicos usando a chave 'servidor' da planilha
                const servidoresUnicos = [...new Set(dados.map(item => item.servidor))];

                servidoresUnicos.forEach(servidor => {
                    if (servidor) {
                        const opt = document.createElement('option');
                        opt.value = servidor;
                        opt.textContent = servidor;
                        selectJogo.appendChild(opt);
                    }
                });
            } catch (erro) {
                console.log("Erro ao carregar servidores.");
                document.getElementById('jogo').innerHTML = '<option value="" disabled selected>Erro ao carregar servidores</option>';
            }
        }

        carregarServidores();

        // Envio do formulário filtrando exclusivamente os choros do servidor escolhido
        document.getElementById('reclamacaoForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const nome = document.getElementById('nome').value;
            const jogoSelecionado = document.getElementById('jogo').value;
            const digitadoPeloUsuario = document.getElementById('choroUsuario').value;

            let choroSorteado = "Reclamou que a planilha falhou e chorou no seco.";

            try {
                const resposta = await fetch(urlSheetDB);
                const dados = await resposta.json();

                // Filtra estritamente as linhas onde a coluna 'servidor' bate com o jogo selecionado
                const chorosDesteServidor = dados.filter(item => item.servidor === jogoSelecionado);

                if (chorosDesteServidor.length > 0) {
                    const itemSorteado = chorosDesteServidor[Math.floor(Math.random() * chorosDesteServidor.length)];
                    choroSorteado = itemSorteado.choro || "Chorou por nada específico.";
                } else {
                    choroSorteado = "Reclamou de um problema imaginário neste servidor.";
                }
            } catch (erro) {
                console.log("Erro ao buscar choro filtrado.");
            }

            const webhookURL = "https://discord.com/api/webhooks/1541831326057889814/Td276oG9XcY662bW-AkaDc-XzzQAdk_8G2H8WQq7Fy8ii3m3-PCS229L5iADVtA035wM";

            const payload = {
                content: `📢 **NOVA RECLAMAÇÃO NA OUVIDORIA!**\n👤 **Chorão:** ${nome}\n🎮 **Servidor:** ${jogoSelecionado}\n😭 **Choro:** "${choroSorteado}"`
            };

            await fetch(webhookURL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            alert(`Valeu, ${nome}! Sua reclamação sobre ${jogoSelecionado} foi enviada para a lixeira! 😂`);
            document.getElementById('reclamacaoForm').reset();
            carregarServidores();
        });
    </script>

</body>
</html>
