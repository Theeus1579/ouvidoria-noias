<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ouvidoria Oficial - Só Noia de Corote</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 500px;
            border: 2px solid #ff4444;
        }
        h1 {
            color: #ff4444;
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 10px;
        }
        p.subtitle {
            text-align: center;
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            background-color: #2b2b2b;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
        }
        textarea {
            resize: vertical;
            height: 100px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #ff4444;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #cc0000;
        }
        .footer {
            text-align: center;
            margin-top: 15px;
            font-size: 0.8rem;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🚨 OUVIDORIA DOS NOIAS 🚨</h1>
        <p class="subtitle">O servidor caiu? O mod tá ruim? Digite seu choro (que será solenemente ignorado e substituído por uma zoeira da planilha).</p>
        
        <form id="reclamacaoForm">
            <label for="nome">Seu Nick de Chorão:</label>
            <input type="text" id="nome" required placeholder="Ex: MaHaunter">

            <label for="jogo">Qual servidor estragou seu dia?</label>
            <input type="text" id="jogo" required placeholder="Ex: Palworld / 7 Days / RPG">

            <label for="choroUsuario">Sua Reclamação Dramática:</label>
            <textarea id="choroUsuario" required placeholder="Escreva seu choro (ele vai sumir e a planilha vai decidir o que você realmente reclamou)..."></textarea>

            <button type="submit">Enviar Reclamação para o Lixo 🗑️</button>
        </form>
        
        <div class="footer">
            "Ninguém aqui é obrigado" - Regra 6 📜
        </div>
    </div>

    <script>
        document.getElementById('reclamacaoForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const nome = document.getElementById('nome').value;
            const jogo = document.getElementById('jogo').value;
            // Pegamos o que ele digitou só de enfeite, mas a mágica vem da planilha logo abaixo
            const digitadoPeloUsuario = document.getElementById('choroUsuario').value;

            let choroSorteado = "Reclamou que a planilha falhou e chorou no seco.";

            try {
                // Link da API gerada pelo SheetDB
                const urlSheetDB = 'https://sheetdb.io/api/v1/9d77rwu58o76z';
                
                const resposta = await fetch(urlSheetDB);
                const dados = await resposta.json();

                if (dados && dados.length > 0) {
                    // Sorteia um item aleatório do array e pega a propriedade 'Choro' da planilha
                    const itemSorteado = dados[Math.floor(Math.random() * dados.length)];
                    choroSorteado = itemSorteado.Choro || "Chorou por nada específico.";
                }
            } catch (erro) {
                console.log("Erro ao buscar na planilha, usando choro padrão.");
            }

            const webhookURL = "https://discord.com/api/webhooks/1541831326057889814/Td276oG9XcY662bW-AkaDc-XzzQAdk_8G2H8WQq7Fy8ii3m3-PCS229L5iADVtA035wM";

            // O Discord recebe o nome, o jogo e O CHORO SORTEADO DA PLANILHA (ignorando o que ele digitou na caixa)
            const payload = {
                content: `📢 **NOVA RECLAMAÇÃO NA OUVIDORIA!**\n👤 **Chorão:** ${nome}\n🎮 **Servidor:** ${jogo}\n😭 **Choro (O usuário digitou: "${digitadoPeloUsuario}"), mas a planilha decretou:** "${choroSorteado}"`
            };

            await fetch(webhookURL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            alert(`Valeu, ${nome}! Sua reclamação foi solenemente ignorada e substituída por uma da planilha! 😂`);
            document.getElementById('reclamacaoForm').reset();
        });
    </script>

</body>
</html>
